# VPN Hub Lite — конфигурация Worker.
#
# Что заменить после `wrangler d1 create` и `wrangler kv namespace create`:
#   database_id и id ниже. Всё остальное можно оставить как есть.

name = "vpn-hub-lite"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# --- D1: данные (пользователи, источники, серверы, назначения) -------------
[[d1_databases]]
binding = "DB"
database_name = "vpn-hub-lite"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# --- KV: кэш готовых подписок и скачанных источников ----------------------
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- Cron: ровно два триггера (лимит бесплатного плана — 5 на аккаунт) ----
[triggers]
crons = [
  "0 */6 * * *",   # sync: внешние подписки → servers, раз в 6 часов
  "*/30 * * * *",  # health: TCP-проверка партии серверов, раз в 30 минут
]

# --- Публичные настройки (не секреты) -------------------------------------
[vars]
# Админ по умолчанию. Можно переопределить секретом:
#   wrangler secret put ADMIN_TG_ID
ADMIN_TG_ID = "8938447065"
# Сколько человек максимум (защита от переполнения)
MAX_USERS = "50"
# Сколько серверов выдавать одному человеку
SERVERS_PER_USER = "3"
# Базовый адрес воркера — нужен для ссылок /sub/<token>
PUBLIC_BASE_URL = "https://vpn-hub-lite.example.workers.dev"
# Один фиксированный User-Agent для всех источников (как у Happ)
FETCH_UA = "Happ/2.9.1"
# TTL кэша подписки в секундах: 600 = 10 минут (экономит и D1, и KV-записи)
SUB_CACHE_TTL = "600"

# --- Наблюдаемость --------------------------------------------------------
[observability]
enabled = true
