# VPN Hub Lite — конфигурация Worker.
#
# Что заменить после `wrangler d1 create` и `wrangler kv namespace create`:
#   database_id и id ниже. Всё остальное можно оставить как есть.

name = "vpn-hub-lite"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# --- D1: данные (пользователи, источники, серверы, назначения) -------------
[[d1_databases]]
binding = "DB"
database_name = "vpn-hub-lite"
database_id = "5fe96e41-4f67-4b64-a9f1-b7a09f989116"

# --- KV: кэш готовых подписок и скачанных источников ----------------------
[[kv_namespaces]]
binding = "CACHE"
id = "31299bcce7184a7f877d90e86853e5d1"

# --- Cron: ровно два триггера (лимит бесплатного плана — 5 на аккаунт) ----
[triggers]
crons = [
  "0 */6 * * *",   # sync: внешние подписки → servers, раз в 6 часов
  "*/30 * * * *",  # health: TCP-проверка партии серверов, раз в 30 минут
  # Резервный транспорт бота: Telegram не резолвит *.workers.dev, поэтому
  # обновления забираем сами. Если появится свой домен и вебхук заработает —
  # поставьте BOT_TRANSPORT="webhook" и уберите эту строку (лимит 5 cron).
  "* * * * *",
]

# --- Публичные настройки (не секреты) -------------------------------------
[vars]
# Админ по умолчанию. Можно переопределить секретом:
#   wrangler secret put ADMIN_TG_ID
ADMIN_TG_ID = "5680608085"
# Сколько человек максимум (защита от переполнения)
MAX_USERS = "50"
# Сколько серверов выдавать одному человеку
SERVERS_PER_USER = "3"
# Базовый адрес воркера — нужен для ссылок /sub/<token>
PUBLIC_BASE_URL = "https://vpn-hub-lite.twistx-launcher.workers.dev"
# Один фиксированный User-Agent для всех источников (как у Happ)
FETCH_UA = "Happ/2.9.1"
# TTL кэша подписки в секундах: 600 = 10 минут (экономит и D1, и KV-записи)
SUB_CACHE_TTL = "600"
# webhook — обычный режим; polling — если Telegram не видит ваш домен
BOT_TRANSPORT = "webhook"

# ── Бонусы и рефералы ──────────────────────────────────────────────────────
# Канал для награды за подписку: @username или -100… . Пусто — экран канала
# и награда выключены, бот работает без них.
CHANNEL_ID = ""
# Username бота без @. Пусто — определим сами через getMe и закэшируем.
BOT_USERNAME = "ApelsinkaVpn1_bot"

# ── Remnawave (необязательно) ──────────────────────────────────────────────
# Пока панели нет — группы работают только в нашей D1, ничего не падает.
# REMNAWAVE_URL и REMNAWAVE_TOKEN задаются секретами:
#   wrangler secret put REMNAWAVE_URL
#   wrangler secret put REMNAWAVE_TOKEN

# --- Наблюдаемость --------------------------------------------------------
[observability]
enabled = true
