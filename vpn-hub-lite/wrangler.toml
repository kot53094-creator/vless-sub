  # РѕР±РЅРѕРІР»РµРЅРёСЏ Р·Р°Р±РёСЂР°РµРј СЃР°РјРё. Р•СЃР»Рё РїРѕСЏРІРёС‚СЃСЏ СЃРІРѕР№ РґРѕРјРµРЅ Рё РІРµР±С…СѓРє Р·Р°СЂР°Р±РѕС‚Р°РµС‚ вЂ”
  # РїРѕСЃС‚Р°РІСЊС‚Рµ BOT_TRANSPORT="webhook" Рё СѓР±РµСЂРёС‚Рµ СЌС‚Сѓ СЃС‚СЂРѕРєСѓ (Р»РёРјРёС‚ 5 cron).
  "* * * * *",
]

