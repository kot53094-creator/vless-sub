name: update-subscription

on:
  schedule:
    # каждые 6 часов (UTC). GitHub может задержать запуск на несколько минут.
    - cron: "17 */6 * * *"
  workflow_dispatch:          # кнопка "Run workflow"
  push:
    branches: [main]
    paths:                    # пересборка при изменении источников или кода
      - "sources.txt"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # коммит обновлённого docs/
  pages: write                # публикация на GitHub Pages
  id-token: write             # требуется deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build subscription
        env:
          # Секрет задаётся в Settings -> Secrets and variables -> Actions.
          # Пока INCLUDE_PRIVATE не выставлен в true, приватный источник не используется.
          PRIVATE_SUB_URL: ${{ secrets.PRIVATE_SUB_URL }}
          INCLUDE_PRIVATE: ${{ vars.INCLUDE_PRIVATE }}
        run: python scripts/merge.py --sources sources.txt --out docs --prev docs/sub.txt

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh subscription [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
