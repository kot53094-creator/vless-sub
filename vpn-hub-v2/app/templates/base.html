<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VPN Hub{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">VPN <span>Hub</span></div>
    <a class="nav-link {{ 'active' if active == 'home' }}" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h7l2-6 3 12 2-6h4"/></svg>
      Главная
    </a>
    <a class="nav-link {{ 'active' if active == 'sources' }}" href="/#sources">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="5" rx="2"/><rect x="3" y="14" width="18" height="5" rx="2"/></svg>
      Источники
    </a>
    {% if people_enabled %}
    <a class="nav-link {{ 'active' if active == 'people' }}" href="/people">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 11h5M18.5 8.5v5"/></svg>
      Люди
    </a>
    {% endif %}
    <a class="nav-link {{ 'active' if active == 'settings' }}" href="/settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      Настройки
    </a>
    <a class="nav-link {{ 'active' if active == 'audit' }}" href="/audit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      Журнал
    </a>
    <a class="nav-link" href="/#help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      Что делать дальше
    </a>
    <div style="margin-top:auto">
      <button class="btn ghost small" onclick="hubToggleTheme()" aria-label="Переключить тему">Тема</button>
      <a class="nav-link" href="/logout" style="margin-top:8px">Выйти</a>
    </div>
  </aside>

  <main class="content">
    {% block body %}{% endblock %}
  </main>
</div>

<nav class="bottom-nav">
  <a href="/" class="active">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h7l2-6 3 12 2-6h4"/></svg>
    Главная
  </a>
  <a href="/#sources">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="5" rx="2"/><rect x="3" y="14" width="18" height="5" rx="2"/></svg>
    Источники
  </a>
  <a href="{% if people_enabled %}/people{% else %}/#help{% endif %}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/></svg>
    Люди
  </a>
  <a href="/#more">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    Ещё
  </a>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
