services:
  app:
    build: .
    container_name: vpn-hub
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8080:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  # Бот работает на том же токене, что уже есть. Без BOT_TOKEN контейнер
  # просто завершится с кодом 0 и не будет перезапускаться.
  bot:
    build: .
    container_name: vpn-hub-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    depends_on:
      - app
    command: python -m app.bot.main

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
