<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · VPN Hub</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8ecf3;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 .card{width:min(360px,92vw);background:#171a21;border:1px solid #262b36;border-radius:16px;padding:22px}
 h1{font-size:20px;margin:0 0 4px} p{color:#8b95a7;margin:0 0 14px;font-size:13px}
 input{width:100%;padding:11px 12px;margin:6px 0 12px;border-radius:10px;border:1px solid #262b36;
       background:#12151b;color:#e8ecf3;font-size:15px}
 button{width:100%;padding:11px;border:0;border-radius:10px;background:#ff8a3d;color:#101318;
        font-weight:700;font-size:15px;cursor:pointer}
 .err{background:#3a1d20;color:#ffb3b7;padding:9px 11px;border-radius:9px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1>VPN Hub</h1>
  <p>Вход в панель управления ключами</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="Логин" autocomplete="username" autofocus>
  <input name="password" type="password" placeholder="Пароль" autocomplete="current-password">
  {% if totp %}
    <input name="totp" placeholder="Код из приложения (6 цифр)" inputmode="numeric"
           autocomplete="one-time-code" maxlength="7">
  {% endif %}
  <button type="submit">Войти</button>
</form>
</body>
</html>
