<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VPN Hub{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#262b36;
    --text:#e8ecf3; --dim:#8b95a7; --accent:#ff8a3d; --ok:#41c98a;
    --warn:#f0b429; --bad:#f2555a; --link:#69b7ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--link);text-decoration:none}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 14px}
  .brand{font-weight:700;margin-right:8px;color:var(--accent);white-space:nowrap}
  .bar a{padding:7px 11px;border-radius:9px;color:var(--dim);white-space:nowrap}
  .bar a.active{background:var(--card2);color:var(--text)}
  main{max-width:980px;margin:0 auto;padding:16px 14px 60px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.04em}
  .big{font-size:26px;font-weight:700}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;
       padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;
        background:var(--card2);color:var(--dim)}
  .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
  .btn{display:inline-block;padding:9px 14px;border-radius:10px;border:0;
       background:var(--accent);color:#101318;font-weight:600;cursor:pointer;font-size:14px}
  .btn.ghost{background:var(--card2);color:var(--text)}
  .btn.danger{background:#3a1d20;color:#ff9aa0}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;
       border:1px solid var(--line);background:#12151b;color:var(--text);font-size:15px}
  label{display:block;margin:12px 0 5px;color:var(--dim);font-size:13px}
  .bar-track{height:7px;background:#0c0e13;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar-fill{height:100%;background:var(--ok)}
  .bar-fill.warn{background:var(--warn)} .bar-fill.bad{background:var(--bad)}
  #log{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:10px;
       font:12px/1.45 ui-monospace,Consolas,monospace;height:340px;overflow:auto;white-space:pre-wrap}
  .err{background:#3a1d20;color:#ffb3b7;padding:10px 12px;border-radius:10px;margin-bottom:10px}
  .notice{background:#1c2417;color:#bfe3a6;padding:10px 12px;border-radius:10px;margin-bottom:10px}
  @media(max-width:560px){ .big{font-size:22px} main{padding:12px 10px 60px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">VPN Hub</span>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Главная</a>
    <a href="/sources" class="{{ 'active' if request.url.path.startswith('/sources') else '' }}">Источники</a>
    <a href="/add" class="{{ 'active' if request.url.path == '/add' else '' }}">Добавить ключ</a>
    <a href="/sync" class="{{ 'active' if request.url.path == '/sync' else '' }}">Синхронизация</a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Настройки</a>
    <a href="/logout" style="margin-left:auto">Выход</a>
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
